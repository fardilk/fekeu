version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fotonota_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fotonota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fotonota_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fotonota_api
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/fotonota?sslmode=disable
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - WATCH_DIR=/app/public/keu
    ports:
      - "8080:8080"
    volumes:
      - ./public:/app/public
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fotonota_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fotonota_network:
    driver: bridge
