name: Build, Push, and Auto-Deploy Fotonota Backend

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # LOGIN GHCR
      # -------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # -------------------------
      # BUILDx
      # -------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # BUILD & PUSH API
      # -------------------------
      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          target: runtime
          tags: |
            ghcr.io/${{ github.repository_owner }}/fotonota-be:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/fotonota-be:${{ github.ref_name }}-${{ github.sha }}

      # -------------------------
      # BUILD & PUSH WATCHER
      # -------------------------
      - name: Build & Push Watcher image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          target: watcher
          tags: |
            ghcr.io/${{ github.repository_owner }}/fotonota-watcher:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/fotonota-watcher:${{ github.ref_name }}-${{ github.sha }}

      # -------------------------
      # DEPLOY API + WATCHER ke VPS
      # -------------------------
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            echo "=========== SELECT ENV ==========="
            if [ "${{ github.ref_name }}" = "main" ]; then
              PORT=8080
              ENV_FILE="/var/www/be/fotonota-be/prod/.env"
              BASE_PATH="/var/www/be/fotonota-be/prod"
            else
              PORT=8081
              ENV_FILE="/var/www/be/fotonota-be/dev/.env"
              BASE_PATH="/var/www/be/fotonota-be/dev"
            fi

            echo "=========== PULL API IMAGE ==========="
            docker pull ghcr.io/${{ github.repository_owner }}/fotonota-be:${{ github.ref_name }}

            echo "=========== STOP OLD API ==========="
            docker stop fotonota-${{ github.ref_name }} || true
            docker rm fotonota-${{ github.ref_name }} || true

            echo "=========== START NEW API ==========="
            docker run -d \
              --name fotonota-${{ github.ref_name }} \
              --env-file ${ENV_FILE} \
              -p ${PORT}:8080 \
              ghcr.io/${{ github.repository_owner }}/fotonota-be:${{ github.ref_name }}

            echo "=========== PREPARE OCR FOLDERS ==========="
            mkdir -p ${BASE_PATH}/public/keu
            mkdir -p ${BASE_PATH}/public/processed

            echo "=========== PULL WATCHER IMAGE ==========="
            docker pull ghcr.io/${{ github.repository_owner }}/fotonota-watcher:${{ github.ref_name }}

            echo "=========== STOP OLD WATCHER ==========="
            docker stop fotonota-watcher-${{ github.ref_name }} || true
            docker rm fotonota-watcher-${{ github.ref_name }} || true

            echo "=========== START WATCHER ==========="
            docker run -d \
              --name fotonota-watcher-${{ github.ref_name }} \
              -v ${BASE_PATH}/public/keu:/app/public/keu \
              -v ${BASE_PATH}/public/processed:/app/public/processed \
              ghcr.io/${{ github.repository_owner }}/fotonota-watcher:${{ github.ref_name }}

            echo "=========== DEPLOYMENT DONE for ${{ github.ref_name }} ==========="
