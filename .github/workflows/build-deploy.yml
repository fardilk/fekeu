name: Build, Push, and Auto-Deploy Fotonota Backend

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/fotonota-be:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/fotonota-be:${{ github.ref_name }}-${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo ">>> Pulling latest image..."
            docker pull ghcr.io/${{ github.repository_owner }}/fotonota-be:${{ github.ref_name }}

            echo ">>> Stopping old container..."
            docker stop fotonota-${{ github.ref_name }} || true
            docker rm fotonota-${{ github.ref_name }} || true

            echo ">>> Selecting environment settings..."
            if [ "${{ github.ref_name }}" = "main" ]; then
              PORT=8080
              ENV_FILE="/var/www/be/fotonota-be/prod/.env"
            else
              PORT=8081
              ENV_FILE="/var/www/be/fotonota-be/dev/.env"
            fi

            echo ">>> Starting new container..."
            docker run -d \
              --name fotonota-${{ github.ref_name }} \
              --env-file ${ENV_FILE} \
              -p ${PORT}:8080 \
              ghcr.io/${{ github.repository_owner }}/fotonota-be:${{ github.ref_name }}

            echo ">>> Deployment SUCCESSFUL for branch: ${{ github.ref_name }}!"
